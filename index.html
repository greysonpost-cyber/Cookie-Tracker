<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cookie Tracker" />
  <title>Cookie Tracker</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">SCHOOL COOKIE SALES</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </header>

    <main id="mainContent" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-view="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-view="inventory" class="nav-item"><span>▦</span><small>Inventory</small></button>
      <button data-view="sell" class="nav-item sell-nav"><span>＋</span><small>Sell</small></button>
      <button data-view="orders" class="nav-item"><span>☷</span><small>Orders</small></button>
      <button data-view="money" class="nav-item"><span>$</span><small>Money</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal-card" id="modalCard" role="dialog" aria-modal="true"></section>
  </div>

  <input id="importFile" type="file" accept="application/json" hidden />
  <script src="app.js"></script>
</body>
</html>
